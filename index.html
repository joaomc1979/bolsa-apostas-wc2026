<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolsa de Apostas — Mundial 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f6f6f4;--bg3:#ebebea;
  --text:#1a1a18;--text2:#6a6a66;--text3:#aaa;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.2);
  --green:#1D9E75;--red:#D85A30;--amber:#BA7517;
  --gold-bg:#FFF3D0;--gold-t:#7A4A00;
  --sil-bg:#EBEBEB;--sil-t:#333;
  --bro-bg:#FDEEDE;--bro-t:#7A2800;
  --info-bg:#E8F3FF;--info-t:#1A5FA8;
  --r:8px;--rl:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181a;--bg2:#232325;--bg3:#2d2d30;
  --text:#f0f0ee;--text2:#aaa;--text3:#666;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);
  --gold-bg:#3D2800;--gold-t:#FAC764;
  --sil-bg:#333;--sil-t:#ccc;
  --bro-bg:#3D1200;--bro-t:#FDCBA8;
  --info-bg:#0D2E52;--info-t:#90C4F5;
}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
.w{max-width:960px;margin:0 auto;padding:16px;}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:16px;border-bottom:.5px solid var(--border);margin-bottom:20px;}
.hdr h1{font-size:19px;font-weight:600;}
.hdr .sub{font-size:12px;color:var(--text2);margin-top:3px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg2);border:.5px solid var(--border);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.dot.on{background:#22c55e;animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
.tabs{display:flex;border-bottom:.5px solid var(--border);margin-bottom:20px;}
.tab{font-size:13px;padding:8px 16px;cursor:pointer;border:none;background:transparent;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;}
.tab:hover{color:var(--text);}.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:500;}
.panel{display:none;}.panel.on{display:block;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:20px;}
.met{background:var(--bg2);border-radius:var(--r);padding:12px;text-align:center;}
.met .v{font-size:22px;font-weight:600;line-height:1.2;}
.met .l{font-size:11px;color:var(--text2);margin-top:2px;}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
input,select{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);color:var(--text);padding:7px 10px;font-size:13px;outline:none;transition:border .15s;}
input:focus,select:focus{border-color:var(--border2);}
button{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--r);color:var(--text);padding:7px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;}
button:hover{background:var(--bg3);}button:active{transform:scale(.98);}
button.pri{background:var(--text);color:var(--bg);border-color:var(--text);}button.pri:hover{opacity:.85;}
button.sm{padding:4px 9px;font-size:12px;}
.ow{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:11px;font-weight:500;color:var(--text2);text-align:left;padding:7px 10px;border-bottom:.5px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
th:hover{color:var(--text);}
td{padding:7px 10px;border-bottom:.5px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.hi td{background:var(--info-bg);}
.rb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2);}
.r1{background:var(--gold-bg);color:var(--gold-t);}.r2{background:var(--sil-bg);color:var(--sil-t);}.r3{background:var(--bro-bg);color:var(--bro-t);}
.pts{font-weight:600;font-size:14px;}
.pb{background:var(--bg3);border-radius:3px;height:5px;width:70px;display:inline-block;vertical-align:middle;overflow:hidden;}
.pf{height:5px;border-radius:3px;background:var(--green);}
.det{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:16px;margin-top:12px;}
.det h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.dmg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px;}
.dm{background:var(--bg2);border-radius:var(--r);padding:10px;text-align:center;}
.dm .dv{font-size:18px;font-weight:600;}.dm .dl{font-size:11px;color:var(--text2);}
.gp{color:var(--green);}.gn{color:var(--red);}.gz{color:var(--text3);}
.gc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:10px;}
.gc[onclick]:hover{border-color:var(--text3);}
.gc-on{border-color:var(--text);}
.gc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
.gc-t{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;}
.gc-n{font-size:11px;color:var(--text3);min-width:22px;}
.gc-b{font-size:11px;background:var(--bg2);padding:3px 8px;border-radius:var(--r);color:var(--text2);}
.gc-body{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sb{font-size:16px;font-weight:600;background:var(--bg2);padding:5px 14px;border-radius:var(--r);display:inline-flex;align-items:center;gap:10px;}
.sb.live{border:.5px solid #22c55e;color:#22c55e;}
.chip{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;}
.c-f{background:#d1fae5;color:#065f46;}.c-l{background:#fef3c7;color:#92400e;animation:blink .9s infinite;}.c-s{background:var(--bg3);color:var(--text2);}
@media(prefers-color-scheme:dark){.c-f{background:#064e3b;color:#6ee7b7;}.c-l{background:#451a03;color:#fcd34d;}}
.fin-sec{background:var(--bg2);border-radius:var(--rl);padding:16px;max-width:440px;margin-bottom:20px;}
.fin-r{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.fin-r:last-child{margin-bottom:0;}
.fin-r label{font-size:13px;color:var(--text2);min-width:90px;}
.cp-ok{font-size:12px;color:var(--green);display:none;}
.empty{text-align:center;color:var(--text2);padding:32px;font-size:13px;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--text2);border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle;}
@keyframes rot{to{transform:rotate(360deg);}}
.info-note{font-size:11px;color:var(--text3);margin-top:6px;}
</style>
</head>

<div class="w">

<div class="hdr">
  <div>
    <h1>🏆 Bolsa de Apostas — Mundial 2026</h1>
    <div class="sub">8.ª Edição &nbsp;·&nbsp; 71 apostadores </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
    <div class="badge"><span class="dot" id="dot"></span><span id="st">A carregar...</span></div>
    <div style="font-size:11px;color:var(--text2)"><span id="gp">0</span>/72 jogos · <span id="lu">—</span></div>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="goTab('r')">📊 Ranking</button>
  <button class="tab" onclick="goTab('j')">⚽ Jogos</button>
  <button class="tab" onclick="goTab('f')">🏅 Fase Final</button>
</div>

<!-- RANKING -->
<div id="p-r" class="panel on">
  <div class="metrics">
    <div class="met"><div class="v" id="ml">—</div><div class="l">Líder</div></div>
    <div class="met"><div class="v" id="mp">0</div><div class="l">Pontos do 1.º</div></div>
    <div class="met"><div class="v" id="ma">0</div><div class="l">Média</div></div>
    <div class="met"><div class="v" id="mf">0</div><div class="l">Jogos perfeitos</div></div>
  </div>
  <div class="ctrl">
    <input type="text" id="sq" placeholder="Pesquisar nome..." oninput="renderR()" style="min-width:190px;">
    <button onclick="copyR()">📋 Copiar ranking</button>
    <span class="cp-ok" id="cok">✓ Copiado!</span>
    <button onclick="loadResults()" class="sm" id="rfb"><span id="rfs" style="display:none" class="spin"></span> Atualizar</button>
  </div>
  <div class="ow" id="rt"></div>
  <div id="dp"></div>
</div>

<!-- JOGOS -->
<div id="p-j" class="panel">
  <div class="ctrl">
    <select id="jf" onchange="renderJ()">
      <option value="all">Todos os jogos</option>
      <option value="fin">Terminados</option>
      <option value="live">A decorrer</option>
      <option value="up">Por jogar</option>
    </select>
  </div>
  <div id="jdp"></div>
  <div id="gl"></div>
</div>

<!-- FASE FINAL -->
<div id="p-f" class="panel">
  <p style="font-size:13px;color:var(--text2);margin-bottom:14px;">Preenchido automaticamente quando o torneio terminar.</p>
  <div class="fin-sec">
    <div class="fin-r"><label>🥇 Campeão</label><select id="f1" onchange="saveFin()"><option value="">— não definido —</option></select></div>
    <div class="fin-r"><label>🥈 Finalista</label><select id="f2" onchange="saveFin()"><option value="">— não definido —</option></select></div>
    <div class="fin-r" style="margin-bottom:0"><label>🥉 3.º lugar</label><select id="f3" onchange="saveFin()"><option value="">— não definido —</option></select></div>
  </div>
  <div id="fp"></div>
</div>

</div>

  if (FIN.third     && eq(p.third,     FIN.third))     pts += 10;
  return pts;
}
function pStats(p) {
  let tot=0, perf=0;
  for (const g of GAMES) { const pts=scoreG(p,g.game); tot+=pts; if(pts===17)perf++; }
  tot += finPts(p);
  return {tot, perf};
}
function buildR() {
  return PLAYERS
    .map(p => { const {tot,perf}=pStats(p); return {...p,tot,perf}; })
    .sort((a,b) => b.tot - a.tot)
    .map((p,i) => { p.rank=i+1; return p; });
}

// ── RANKING ──────────────────────────────────────────────────
function renderR() {
  const q = (document.getElementById('sq')||{}).value || '';
  const ranked = buildR();
  const played = GAMES.filter(g => {const r=RES[String(g.game)]; return r&&r.hg!=null;}).length;
  document.getElementById('gp').textContent = played;
  if (ranked.length) {
    document.getElementById('ml').textContent = ranked[0].name.split(' ')[0].slice(0,12);
    document.getElementById('mp').textContent = ranked[0].tot;
    document.getElementById('ma').textContent = Math.round(ranked.reduce((s,p)=>s+p.tot,0)/ranked.length);
    document.getElementById('mf').textContent = ranked.reduce((s,p)=>s+p.perf,0);
  }
  let rows = q ? ranked.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())) : ranked;
  const sv = [...rows].sort((a,b) => {
    const v = sortA ? 1 : -1;
    if (sortC==='rank') return (a.rank-b.rank)*v;
    if (sortC==='name') return a.name.localeCompare(b.name)*v;
    if (sortC==='tot')  return (a.tot-b.tot)*v;
    if (sortC==='perf') return (a.perf-b.perf)*v;
    return 0;
  });
  const maxP = played > 0 ? played*17 : 1;
  const th = (c,l,w) => `<th style="width:${w||'auto'}" onclick="srt('${c}')">${l}${sortC===c?(sortA?' ↑':' ↓'):''}</th>`;
  let h = `<table><thead><tr>${th('rank','#','34px')}${th('name','Nome')}${th('tot','Pts','52px')}${th('perf','17pts','46px')}<th style="width:90px">%</th></tr></thead><tbody>`;
  for (const p of sv) {
    const bc = p.rank===1?'r1':p.rank===2?'r2':p.rank===3?'r3':'';
    const pct = Math.min(100, Math.round(p.tot/maxP*100));
    const hl = selS===p.sheet ? 'hi' : '';
    h += `<tr class="${hl}" onclick="showD('${p.sheet}')" style="cursor:pointer;">
      <td><span class="rb ${bc}">${p.rank}</span></td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</td>
      <td class="pts">${p.tot}</td>
      <td style="color:var(--text2)">${p.perf}</td>
      <td><div class="pb"><div class="pf" style="width:${pct}%"></div></div></td>
    </tr>`;
  }
  h += `</tbody></table>`;
  document.getElementById('rt').innerHTML = h;
}
function srt(c) { if(sortC===c)sortA=!sortA; else{sortC=c;sortA=(c==='rank'||c==='name');} renderR(); }

function showD(sheet) {
  if (selS===sheet) { selS=null; document.getElementById('dp').innerHTML=''; renderR(); return; }
  selS=sheet; renderR();
  const p = PLAYERS.find(x=>x.sheet===sheet); if(!p) return;
  const {tot,perf} = pStats(p);
  const played = GAMES.filter(g=>{const r=RES[String(g.game)];return r&&r.hg!=null;});
const won = played.filter(g=>{const r=RES[String(g.game)];const pred=p.games[String(g.game)];if(!r||r.hg==null||r.ag==null||!pred||pred.hg==null||pred.ag==null)return false;return Math.sign(+pred.hg-+pred.ag)===Math.sign(+r.hg-+r.ag);}).length;
  const fp = finPts(p);
  let rows = GAMES.map(g => {
    const r=RES[String(g.game)]; const pred=p.games[String(g.game)];
    const isPlayed = r && r.hg!=null && r.ag!=null;
    if (isPlayed) {
      const pts=scoreG(p,g.game);
      const cls=pts>0?'gp':pts<0?'gn':'gz';
      const fsMatch = r&&r.fs&&pred&&pred.fs&&eq(pred.fs,r.fs) ? '⚽' : '';
      return `<tr>
        <td style="color:var(--text3);font-size:11px">${g.game}</td>
        <td style="font-size:12px">${g.home} vs ${g.away}</td>
        <td>${r.hg+'-'+r.ag}</td>
        <td style="color:var(--text2)">${pred?pred.hg+'-'+pred.ag:'?'}</td>
        <td style="color:var(--text3);font-size:11px">${r.fs&&r.fs!=='NO GOALS'?r.fs:'—'} ${fsMatch}</td>
        <td class="${cls}">${pts>=0?'+':''}${pts}</td>
      </tr>`;
    }
    // Jogo ainda por jogar — mostra a aposta do jogador
    const predScore = pred && pred.hg!=null ? pred.hg+'-'+pred.ag : '—';
    const predFs = pred && pred.fs && pred.fs!=='NO GOALS' ? pred.fs
                 : (pred && pred.fs==='NO GOALS' ? 'Sem golos' : '—');
    return `<tr style="opacity:.5">
      <td style="color:var(--text3);font-size:11px">${g.game}</td>
      <td style="font-size:12px">${g.home} vs ${g.away}</td>
      <td style="color:var(--text3)">—</td>
      <td style="color:var(--text2)">${predScore}</td>
      <td style="color:var(--text3);font-size:11px">${predFs}</td>
      <td style="color:var(--text3)">—</td>
    </tr>`;
  }).join('');
  document.getElementById('dp').innerHTML = `<div class="det">
    <h3>${p.name} <button class="sm" onclick="showD('${sheet}')">✕</button></h3>
    <div class="dmg">
      <div class="dm"><div class="dv">${tot}</div><div class="dl">Pontos</div></div>
      <div class="dm"><div class="dv">${won}</div><div class="dl">1X2 certos</div></div>
      <div class="dm"><div class="dv">${perf}</div><div class="dl">Perfeitos</div></div>
      <div class="dm"><div class="dv">${fp}</div><div class="dl">Pts Fase Final</div></div>
    </div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;display:flex;gap:16px;flex-wrap:wrap">
      <span>🥇 ${p.champion||'—'}</span><span>🥈 ${p.runner_up||'—'}</span><span>🥉 ${p.third||'—'}</span>
    </div>
    <table style="width:100%;font-size:12px"><thead><tr><th>#</th><th>Jogo</th><th>Resultado</th><th>Aposta</th><th>1.º golo</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

// ── JOGOS ────────────────────────────────────────────────────
function chipHtml(status, minute) {
  const FIN  = new Set(['FT','AET','PEN']);
  const LIVE = new Set(['1H','2H','ET','BT','P','INT','LIVE']);
  if (FIN.has(status))  return '<span class="chip c-f">FIM</span>';
  if (LIVE.has(status)) return `<span class="chip c-l">${minute||''}′</span>`;
  return '<span class="chip c-s">Agendado</span>';
}
function renderJ() {
  const flt = document.getElementById('jf').value;
  const FIN_S  = new Set(['FT','AET','PEN']);
  const LIVE_S = new Set(['1H','2H','ET','BT','P','INT','LIVE']);
  let list = GAMES;
  if (flt==='fin')  list = GAMES.filter(g=>{const r=RES[String(g.game)];return r&&FIN_S.has(r.status);});
  else if (flt==='live') list = GAMES.filter(g=>{const r=RES[String(g.game)];return r&&LIVE_S.has(r.status);});
  else if (flt==='up')   list = GAMES.filter(g=>{const r=RES[String(g.game)];return !r||r.hg==null;});
  let h='';
  for (const g of list) {
    const r = RES[String(g.game)] || {};
    const isLiveG = new Set(['1H','2H','ET','BT','P','INT','LIVE']).has(r.status);
    const played = r.hg!=null && r.ag!=null;
    const chip = chipHtml(r.status, r.min);
    const scoreHtml = played
      ? `<span class="sb${isLiveG?' live':''}">${r.hg}<span style="opacity:.4;font-size:12px">–</span>${r.ag}</span>`
      : '<span style="color:var(--text3)">— vs —</span>';
    const fsText = r.fs && r.fs!=='NO GOALS' ? r.fs : '—';
    const timeHtml = ptTime(r.kickoff, g.date);
    // jogos ja jogados sao clicaveis -> painel com apostas de todos
    const clickable = played ? ` onclick="showJD(${g.game})" style="cursor:pointer"` : '';
    const openCls = (selJ===g.game) ? ' gc-on' : '';
    h += `<div class="gc${openCls}"${clickable}>
      <div class="gc-h">
        <div class="gc-t"><span class="gc-n">${g.game}</span>${g.home}<span style="opacity:.4;font-size:12px">vs</span>${g.away} ${chip}</div>
        <span class="gc-b">Gr.${g.group} · ${g.date.slice(5).replace('-','/')}${timeHtml}</span>
      </div>
      <div class="gc-body">
        ${scoreHtml}
        <span style="font-size:12px;color:var(--text2)">⚽ 1.º: <strong>${fsText}</strong></span>
        ${played?'<span style="font-size:11px;color:var(--text3);margin-left:auto">ver apostas ›</span>':''}
      </div>
    </div>`;
  }
  document.getElementById('gl').innerHTML = h || '<div class="empty">Sem jogos nesta categoria</div>';
}

// Hora em Portugal a partir do kickoff (UTC, gravado pelo worker). Mostra "(dia N)" se cair no dia seguinte.
function ptTime(kickoff, gameDate) {
  if (!kickoff) return '';
  try {
    const d = new Date(kickoff);
    if (isNaN(d)) return '';
    const hm = d.toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/Lisbon'});
    // dia em Portugal vs dia do calendario do torneio (gameDate = dia "americano")
    const ptDay = d.toLocaleDateString('en-CA', {timeZone:'Europe/Lisbon'}); // YYYY-MM-DD
    let extra = '';
    if (gameDate && ptDay > gameDate) {
      const dayN = parseInt(ptDay.slice(8,10), 10);
      extra = ` (dia ${dayN})`;
    }
    return ` · 🕐 ${hm}${extra}`;
  } catch(e) { return ''; }
}

// ── PAINEL: APOSTAS DE TODOS PARA UM JOGO ────────────────────
let selJ = null;
function showJD(gameNum) {
  if (selJ===gameNum) { selJ=null; document.getElementById('jdp').innerHTML=''; renderJ(); return; }
  selJ = gameNum;
  const g = GAMES.find(x=>x.game===gameNum);
  const r = RES[String(gameNum)];
  if (!g || !r || r.hg==null) { selJ=null; return; }
  const fsReal = r.fs && r.fs!=='NO GOALS' ? r.fs : '—';
  // apostas de todos, com pontos nesse jogo, ordenadas por pontos desc
  const rows = PLAYERS.map(p => {
    const pred = p.games[String(gameNum)];
    const pts = scoreG(p, gameNum);
    const fsMatch = pred && pred.fs && r.fs && eq(pred.fs, r.fs) ? '⚽' : '';
    return { p, pred, pts, fsMatch };
  }).sort((a,b)=> b.pts - a.pts || a.p.name.localeCompare(b.p.name));
  const body = rows.map(x => {
    const cls = x.pts>0?'gp':x.pts<0?'gn':'gz';
    const pv = x.pred && x.pred.hg!=null ? `${x.pred.hg}-${x.pred.ag}` : '?';
    const fsv = x.pred && x.pred.fs && x.pred.fs!=='NO GOALS' ? x.pred.fs : '—';
    return `<tr style="cursor:pointer" onclick="goTab('r');showD('${x.p.sheet}')">
      <td style="font-size:12px">${x.p.name}</td>
      <td style="color:var(--text2)">${pv}</td>
      <td style="color:var(--text3);font-size:11px">${fsv} ${x.fsMatch}</td>
      <td class="${cls}">${x.pts>=0?'+':''}${x.pts}</td>
    </tr>`;
  }).join('');
  document.getElementById('jdp').innerHTML = `<div class="det">
    <h3>Jogo ${g.game}: ${g.home} ${r.hg}–${r.ag} ${g.away} <button class="sm" onclick="showJD(${gameNum})">✕</button></h3>
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px">⚽ 1.º golo: <strong>${fsReal}</strong> · ${rows.length} apostas (ordenadas por pontos neste jogo)</div>
    <table style="width:100%;font-size:12px"><thead><tr><th>Apostador</th><th>Prev.</th><th>1.º golo</th><th>Pts</th></tr></thead><tbody>${body}</tbody></table>
  </div>`;
  document.getElementById('jdp').scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ── FASE FINAL ───────────────────────────────────────────────
function renderFT() {
  const sels = [['f1',FIN.champion],['f2',FIN.runner_up],['f3',FIN.third]];
  for (const [sid,cur] of sels) {
    const sel = document.getElementById(sid);
    while (sel.options.length>1) sel.remove(1);
    for (const t of TEAMS) {
      const o = document.createElement('option');
      o.value=t; o.textContent=t;
      if (eq(t,cur)) o.selected=true;
      sel.appendChild(o);
    }
  }
  renderFP();
}
function saveFin() {
  FIN.champion  = document.getElementById('f1').value;
  FIN.runner_up = document.getElementById('f2').value;
  FIN.third     = document.getElementById('f3').value;
  renderR(); renderFP();
}
function renderFP() {
  const w = document.getElementById('fp');
  if (!FIN.champion && !FIN.runner_up && !FIN.third) { w.innerHTML=''; return; }
  const rows = PLAYERS.map(p=>({...p,fp:finPts(p)})).sort((a,b)=>b.fp-a.fp);
  let h = `<h3 style="font-size:14px;font-weight:600;margin-bottom:10px">Previsões — fase final</h3>
    <div class="ow"><table><thead><tr><th>Nome</th><th>Campeão</th><th>Finalista</th><th>3.º</th><th>Pts</th></tr></thead><tbody>`;
  for (const p of rows) {
    const c = FIN.champion  && eq(p.champion,  FIN.champion)  ? '✓' : '';
    const r = FIN.runner_up && eq(p.runner_up, FIN.runner_up) ? '✓' : '';
    const t = FIN.third     && eq(p.third,     FIN.third)     ? '✓' : '';
    h += `<tr><td>${p.name}</td>
      <td style="color:${c?'var(--green)':'var(--text2)'}">${p.champion||'—'} ${c}</td>
      <td style="color:${r?'var(--green)':'var(--text2)'}">${p.runner_up||'—'} ${r}</td>
      <td style="color:${t?'var(--green)':'var(--text2)'}">${p.third||'—'} ${t}</td>
      <td class="pts">${p.fp}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  w.innerHTML = h;
}

// ── UTILS ────────────────────────────────────────────────────
function copyR() {
  const ranked = buildR();
  const gp = GAMES.filter(g=>{const r=RES[String(g.game)];return r&&r.hg!=null;}).length;
  const txt = '🏆 Bolsa de Apostas — Mundial 2026\n'+gp+'/72 jogos disputados\n\n'+
    ranked.map(p=>`${p.rank}. ${p.name} — ${p.tot} pts`).join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const m=document.getElementById('cok'); m.style.display='inline';
    setTimeout(()=>m.style.display='none', 2500);
  }).catch(()=>{});
}
function goTab(id) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  const map={r:0,j:1,f:2};
  document.querySelectorAll('.tab')[map[id]].classList.add('on');
  if (id==='f') renderFT();
  if (id==='j') renderJ();
}

// ── INIT ─────────────────────────────────────────────────────
renderR(); renderJ();
loadResults();
</script>
